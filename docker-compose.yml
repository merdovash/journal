services:
  postgres:
    image: postgres:16-alpine
    container_name: broker-journal-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker_journal
    volumes:
      - broker_journal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker_journal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  broker_journal_pg:
